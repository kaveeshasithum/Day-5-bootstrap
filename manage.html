<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Menu - Fast Food Delivery</title>

    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- External Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="manage">

<!-- Sticky Navbar -->
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container px-4">
        <a class="navbar-brand" href="index.html">
            <img
                src="https://img.freepik.com/premium-vector/minimalist-food-delivery-logo-design-modern-simple-branding-delivery-services_838011-283.jpg"
                alt="Logo"
                width="60"
                height="50"
                class="rounded">
            <h1>Menu Manager</h1>
        </a>

        <div class="d-flex gap-2">
            <a class="btn btn-cart" href="index.html">
                <i class="bi bi-arrow-left-circle"></i> Back to Menu
            </a>
        </div>
    </div>
</nav>

<div class="container my-5">

    <!-- Add, Update Price & Delete Panel -->
    <div class="manager-box mb-5">
        <div class="mb-3">
            <h2 class="section-title mb-1">Manage Burgers (BR...) & Bottles (BO...)</h2>
            <p class="subtitle mb-0 small">Add new items, update prices, or delete items • Saved in browser LocalStorage</p>
        </div>

        <!-- Add New Item Form -->
        <form id="addItemForm" class="row g-2 mb-3">
            <div class="col-md-2">
                <select id="newCategory" class="form-select custom-input" onchange="suggestNextId()">
                    <option value="burger">Burger (BR)</option>
                    <option value="bottle">Bottle (BO)</option>
                </select>
            </div>
            <div class="col-md-2">
                <input type="text" id="newId" class="form-control custom-input" placeholder="BR019" required>
            </div>
            <div class="col-md-4">
                <input type="text" id="newName" class="form-control custom-input" placeholder="Item Name" required>
            </div>
            <div class="col-md-2">
                <input type="number" id="newPrice" class="form-control custom-input" placeholder="Price (Rs.)" min="1" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-order py-2"><i class="bi bi-plus-circle"></i> Add</button>
            </div>
        </form>

        <!-- Select Item + New Price + Update & Delete Buttons Right Beside -->
        <div class="row g-2 align-items-center update-row pt-3">
            <div class="col-md-6">
                <select id="selectManageItem" class="form-select custom-input" onchange="syncSelectedPrice()"></select>
            </div>
            <div class="col-md-2">
                <input type="number" id="updatePriceInput" class="form-control custom-input" placeholder="New Price (Rs.)" min="1">
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-update w-100" onclick="updateItemPrice()">Update Price</button>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-delete w-100" onclick="deleteSelectedItem()"><i class="bi bi-trash"></i> Delete</button>
            </div>
        </div>
    </div>

    <!-- Saved Burgers Table -->
    <div class="manager-box mb-4">
        <h4 class="section-title mb-3">Saved Burgers Array (LocalStorage)</h4>
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0 custom-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Burger Name</th>
                        <th>Price (Rs.)</th>
                    </tr>
                </thead>
                <tbody id="manage-burgers-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- Saved Bottled Drinks Table -->
    <div class="manager-box">
        <h4 class="section-title drinks-title mb-3">Saved Bottled Drinks Array (LocalStorage)</h4>
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0 custom-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Bottle Name</th>
                        <th>Price (Rs.)</th>
                    </tr>
                </thead>
                <tbody id="manage-bottles-tbody"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- Toast Notification -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="orderToast" class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toast-message">
                Updated!
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="manage.js"></script>
</body>
</html>
